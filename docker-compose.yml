services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: sajudang
      POSTGRES_PASSWORD: sajudang
      POSTGRES_DB: sajudang
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sajudang"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
