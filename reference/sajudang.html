<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성신당 星辰堂</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════ 로판 팔레트 ══════════ */
:root{
  --bg:#0C0A12; --bg2:#151220; --bg3:#1D1829;
  --line:#2E2740; --line2:#3A3150;
  --paper:#F2ECE4; --paper2:#B5ABBE; --paper3:#726A80;
  --gold:#E5B87A; --rose:#D98BA5; --lav:#A896D4; --teal:#7FC4BC;
  --ember:#C9707A;
  --c:#E5B87A;              /* 캐릭터 테마 — JS가 교체 */
  --serif:"Gowun Batang",serif; --sans:"Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08060D;color:var(--paper);font-family:var(--sans);font-weight:300;
 line-height:1.85;-webkit-font-smoothing:antialiased}

/* ══════════ RAIL ══════════ */
.rail{position:fixed;left:0;top:0;bottom:0;width:216px;z-index:90;background:#06040A;
 border-right:1px solid var(--line);padding:18px 13px;font-family:var(--mono);
 font-size:10px;color:var(--paper3);overflow-y:auto}
.rail h1{font-family:var(--serif);font-size:15px;color:var(--gold);letter-spacing:.1em}
.rail .v{font-size:9px;margin-bottom:14px;opacity:.6}
.rail .gh{display:block;font-size:8.5px;letter-spacing:.16em;color:var(--gold);
 margin:14px 0 5px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.rail a{display:flex;gap:6px;color:var(--paper3);text-decoration:none;padding:3px 4px;font-size:10px}
.rail a:hover{color:var(--paper2)}.rail a.on{color:var(--gold)}
.rail a b{font-weight:400;opacity:.45;width:20px;flex:none}
.inrow{display:flex;gap:3px;margin-bottom:5px}
.inrow input,.inrow select{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);
 color:var(--paper);padding:6px 2px;font-family:var(--mono);font-size:10px;text-align:center;outline:none}
.mini{width:100%;background:var(--gold);border:none;color:#08060D;padding:7px;
 font-family:var(--mono);font-size:9.5px;cursor:pointer;margin-top:2px}
.gg{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:5px}
.gg button{background:none;border:1px solid var(--line);font-family:var(--serif);
 font-size:11px;padding:4px 0;cursor:pointer}
.fx{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);line-height:1.9}
.fx b{color:var(--c);font-weight:400}
.rtog{display:none}

/* ══════════ STAGE ══════════ */
.stage{margin-left:216px;display:flex;justify-content:center;padding:22px 16px 100px;
 background:radial-gradient(70% 45% at 50% 0%,rgba(229,184,122,.05),transparent 70%)}
.phone{width:100%;max-width:440px;background:var(--bg);border:1px solid var(--line);
 min-height:88vh;position:relative;overflow:hidden}
/* ══════════ 장면 아트 ══════════ */
.sceneart{position:relative;width:100%;margin-bottom:18px;cursor:pointer}
.sceneart svg{width:100%;height:auto;display:block}
.sceneart .slot{position:absolute;top:5px;right:5px;font-family:var(--mono);font-size:7.5px;
 color:var(--c);border:1px dashed var(--c);padding:2px 6px;opacity:.55;
 background:rgba(12,10,18,.7);transition:.16s}
.sceneart:hover .slot{opacity:1}
.sceneart.inline{margin-bottom:12px}
.sceneart.hero{margin:-26px -22px 20px;width:calc(100% + 44px)}

/* 장면 모션 */
@keyframes flicker{0%,100%{opacity:.55}45%{opacity:.85}70%{opacity:.5}}
@keyframes drift{from{transform:translateX(0);opacity:.25}to{transform:translateX(26px);opacity:0}}
@keyframes doorOpen{from{transform:scaleX(1)}to{transform:scaleX(.18)}}
@keyframes inkSpread{from{r:0;opacity:.7}to{r:13;opacity:0}}
@keyframes unroll{from{width:14%}to{width:100%}}
.sFlick{animation:flicker 3.4s ease-in-out infinite}
.sDrift{animation:drift 7s linear infinite}
.sDoor{animation:doorOpen 2.4s ease-out forwards;transform-origin:left center}
.sInk{animation:inkSpread 3s ease-out infinite}
.sUnroll{animation:unroll 1.6s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}
 18%{opacity:.85}100%{transform:translateY(-46px);opacity:0}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes shaft{0%,100%{opacity:.18}50%{opacity:.38}}
@keyframes beadSway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.sMote{animation:floatUp 6s linear infinite}
.sHover{animation:hover 4.6s ease-in-out infinite}
.sSpin{animation:spinSlow 40s linear infinite;transform-origin:center}
.sShaft{animation:shaft 5s ease-in-out infinite}
.sBead{animation:beadSway 6s ease-in-out infinite;transform-origin:top center}

/* 프롬프트 모달 */
.pmod{position:fixed;inset:0;z-index:120;background:rgba(8,6,13,.94);display:none;
 align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}
.pmod.on{display:flex}
.pmod .in{background:var(--bg2);border:1px solid var(--line);width:100%;max-width:640px;
 max-height:86vh;overflow-y:auto;padding:24px}
.pmod .x{float:right;background:none;border:none;color:var(--paper3);
 font-family:var(--mono);font-size:11px;cursor:pointer}
.pmod h3{font-family:var(--serif);font-size:19px;font-weight:700;margin-bottom:3px}
.pmod .m1{font-family:var(--mono);font-size:10px;color:var(--paper3);margin-bottom:14px}
.pmod .sp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pmod .sp span{font-family:var(--mono);font-size:9.5px;color:var(--paper2);
 border:1px solid var(--line);padding:4px 9px}
.pmod .pl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--gold);
 margin:15px 0 7px;display:flex;justify-content:space-between;align-items:center}
.pmod .pl button{background:none;border:1px solid var(--line);color:var(--paper3);
 font-family:var(--mono);font-size:9px;padding:3px 10px;cursor:pointer}
.pmod pre{background:#08060D;border:1px solid var(--line);padding:13px 15px;
 font-family:var(--mono);font-size:10.5px;line-height:1.75;color:var(--paper2);
 white-space:pre-wrap;word-break:break-word}
.pmod .hint{border-left:2px solid var(--teal);padding:2px 0 2px 13px;margin-top:14px;
 font-size:12px;color:var(--paper2);line-height:1.85}

.lab{position:absolute;top:0;left:0;background:var(--gold);color:#08060D;
 font-family:var(--mono);font-size:8px;letter-spacing:.1em;padding:3px 8px;z-index:40}

/* 상단 네비 */
.topbar{position:sticky;top:0;z-index:35;background:rgba(12,10,18,.96);
 border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;
 padding:10px 12px;backdrop-filter:blur(6px)}
.topbar button{background:none;border:1px solid var(--line);color:var(--paper2);
 font-family:var(--mono);font-size:10px;padding:6px 10px;cursor:pointer;
 transition:.16s;white-space:nowrap}
.topbar button:hover{border-color:var(--c);color:var(--c)}
.topbar button:disabled{opacity:.25;cursor:default;border-color:var(--line)}
.topbar .ttl{flex:1;text-align:center;font-family:var(--serif);font-size:13px;
 color:var(--paper2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar.hide{display:none}

.snd{position:absolute;top:7px;right:7px;z-index:40;background:rgba(21,18,32,.9);
 border:1px solid var(--line);color:var(--paper3);font-family:var(--mono);font-size:9px;
 padding:5px 8px;cursor:pointer}
.snd.on{border-color:var(--gold);color:var(--gold)}
.scr{padding:26px 22px 44px;position:relative;z-index:2}

/* ══════════ 타이포 ══════════ */
.eb{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--c);margin-bottom:11px}
.h1{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.5;margin-bottom:12px}
.h2{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.5;margin-bottom:9px}
.tx{font-size:13.5px;color:var(--paper2);line-height:1.92}
.tx+.tx{margin-top:11px}
.tx b{color:var(--paper);font-weight:400}
.sm{font-family:var(--mono);font-size:9.5px;color:var(--paper3);line-height:1.8}
.mt{margin-top:16px}

.nr{font-family:var(--serif);font-size:16px;line-height:1.98;color:var(--paper2);margin-bottom:18px}
.nr .l{display:block;opacity:0;animation:up .85s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
.nr .ps{display:block;height:10px}
.say{font-family:var(--serif);font-size:17px;line-height:1.82;color:var(--paper);
 border-left:2px solid var(--c);padding-left:16px;margin-bottom:17px}
.say small{display:block;font-family:var(--mono);font-size:9px;color:var(--c);
 letter-spacing:.14em;margin-bottom:6px}
.say b{color:var(--c);font-weight:400}

.btn{width:100%;background:var(--c);border:none;color:#08060D;padding:15px;
 font-family:var(--sans);font-weight:700;font-size:14px;cursor:pointer;margin-top:8px;
 letter-spacing:.02em}
.btn.gh{background:none;border:1px solid var(--line2);color:var(--paper2);font-weight:300}
.btn.gh:hover{border-color:var(--c);color:var(--c)}

.fld{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--paper);
 padding:15px 14px;font-family:var(--mono);font-size:15px;outline:none;text-align:center}
.fld.ser{font-family:var(--serif);font-size:19px}
.fld:focus{border-color:var(--gold)}
.f3{display:flex;gap:7px;margin-bottom:11px}
.f3>div{flex:1;position:relative}
.f3 label{position:absolute;top:-8px;left:9px;background:var(--bg);padding:0 5px;
 font-family:var(--mono);font-size:8.5px;color:var(--paper3)}
.og{display:grid;gap:7px}.og.c2{grid-template-columns:repeat(2,1fr)}
.op{background:var(--bg2);border:1px solid var(--line);color:var(--paper);padding:13px 11px;
 cursor:pointer;font-family:var(--sans);font-size:13px;text-align:left;transition:.16s}
.op:hover,.op.on{border-color:var(--gold);color:var(--gold)}
.op b{display:block;font-family:var(--serif);font-size:15px;font-weight:700;margin-bottom:2px}
.op span{font-size:10.5px;color:var(--paper3)}
.prog{display:flex;gap:4px;margin-bottom:20px}
.prog i{height:2px;flex:1;background:var(--line)}
.prog i.d{background:var(--gold)}

/* ══════════ 캐릭터 ══════════ */
.figwrap{display:flex;justify-content:center;position:relative;margin-bottom:16px}
.figwrap .glow{position:absolute;inset:auto 0 4% 0;height:70%;
 background:radial-gradient(ellipse at 50% 72%,var(--c),transparent 66%);opacity:.16}
.figwrap svg{position:relative;z-index:1}
.imgtag{position:absolute;top:2px;right:4px;font-family:var(--mono);font-size:7.5px;
 color:var(--c);border:1px dashed;padding:1px 5px;opacity:.65;z-index:2}

/* 모션툰 */
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.011)}}
@keyframes blinkk{0%,93%,100%{opacity:0}95%,98%{opacity:1}}
@keyframes swayP{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes riseF{from{transform:translateY(0);opacity:.5}to{transform:translateY(-38px);opacity:0}}
.mBody{animation:breathe 4.6s ease-in-out infinite;transform-origin:bottom center}
.mEye{animation:blinkk 5.4s steps(1) infinite}
.mProp{animation:swayP 4.2s ease-in-out infinite;transform-origin:top center}
.mFx{animation:riseF 5.2s linear infinite}

/* ══════════ 명식 ══════════ */
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:15px 0 9px}
.pil{border:1px solid var(--line);background:var(--bg2);padding:12px 0 10px;text-align:center;
 transform:rotateY(90deg);opacity:0}
.pil.flip{animation:flipIn .55s cubic-bezier(.2,.7,.3,1) forwards}
.ms.static .pil{transform:none;opacity:1}
@keyframes flipIn{to{transform:none;opacity:1}}
.pil .p{font-family:var(--mono);font-size:8px;color:var(--paper3);margin-bottom:5px}
.pil .g,.pil .j{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.15}
.pil .j{color:var(--paper2)}
.pil.self{border-color:var(--c);background:linear-gradient(180deg,rgba(229,184,122,.09),transparent)}
.pil.self .p{color:var(--c)}
.pil.self .g{color:var(--c)}
.pil.self.lit .g{animation:ignite 1.3s ease forwards}
.pil.lk{border-style:dashed;border-color:rgba(229,184,122,.35);background:none}
.pil.lk .g,.pil.lk .j{color:var(--paper3);font-size:18px;opacity:.5}
.pil.lk .p{color:rgba(229,184,122,.7)}
.pil.lk .key{font-family:var(--mono);font-size:7.5px;color:var(--gold);
 margin-top:6px;letter-spacing:.06em}
@keyframes ignite{0%{text-shadow:none}60%{text-shadow:0 0 32px var(--c),0 0 8px var(--c)}
 100%{text-shadow:0 0 16px var(--c)}}
.msnote{font-size:11.5px;color:var(--paper3);line-height:1.75;
 border-left:1px solid var(--line);padding-left:11px}
.msnote b{color:var(--c);font-weight:400}
.calc{border:1px solid rgba(127,196,188,.35);background:rgba(127,196,188,.04);
 padding:13px 15px;margin-top:13px}
.calc .t{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--teal);
 margin-bottom:9px;display:flex;justify-content:space-between}
.calc .r{display:flex;gap:9px;padding:4px 0;font-family:var(--mono);font-size:9.5px;line-height:1.7}
.calc .r .k{width:66px;flex:none;color:var(--paper3)}
.calc .r .v{flex:1;color:var(--paper2)}
.calc .r .v b{color:var(--teal);font-weight:500}
.calc .r .v s{color:var(--paper3);opacity:.6}

.mec{border:1px solid var(--line);padding:14px;display:flex;gap:13px;align-items:center;
 position:relative;overflow:hidden;margin-bottom:16px}
.mec::before{content:"";position:absolute;inset:0;
 background:radial-gradient(70% 100% at 8% 50%,var(--c),transparent 62%);opacity:.14}
.mec>*{position:relative;z-index:1}
.mec .gz{font-family:var(--mono);font-size:9px;color:var(--c);letter-spacing:.1em}
.mec .nm{font-family:var(--serif);font-size:17px;font-weight:700;margin-top:2px}
.mec .tr{font-size:11px;color:var(--paper2);margin-top:3px;line-height:1.6}

/* ══════════ 훅 블록 ══════════ */
.blk{opacity:0;transform:translateY(20px);transition:.65s;padding:19px 0;
 border-bottom:1px solid rgba(46,39,64,.7)}
.blk.in{opacity:1;transform:none}.blk.hide{display:none}
.blk .lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;margin-bottom:10px;color:var(--paper3)}
.blk .lab:empty{display:none}
.stab{border-left:3px solid var(--c);padding:4px 0 4px 18px;margin:6px 0 4px}
.stab p{font-family:var(--serif);font-size:22px;line-height:1.72;color:var(--paper)}
@media(max-width:480px){.stab p{font-size:19px}}
.src{display:inline-block;font-family:var(--mono);font-size:8.5px;color:var(--teal);
 border:1px solid rgba(127,196,188,.35);padding:3px 8px;margin-bottom:11px;letter-spacing:.04em}
.tale{font-family:var(--serif);font-size:16.5px;line-height:1.92;color:var(--paper2)}
.tale+.tale{margin-top:11px}.tale b{color:var(--paper);font-weight:400}
.neg{font-family:var(--serif);font-size:16.5px;line-height:1.92;color:var(--paper2)}
.neg b{color:var(--lav);font-weight:400}
.strk{position:relative;display:inline-block}
.strk::after{content:"";position:absolute;left:0;top:53%;height:1.5px;background:var(--ember);
 width:0;animation:strike .5s ease forwards}
@keyframes strike{to{width:100%}}

.scene{border:1px solid rgba(229,184,122,.32);
 background:linear-gradient(180deg,rgba(229,184,122,.07),transparent 72%);
 padding:20px 18px;position:relative}
.scene::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c)}
.scene p{font-family:var(--serif);font-size:18px;line-height:1.88}
.scene p+p{margin-top:13px}.scene p.hit{color:var(--c)}
.seq{display:flex;margin:15px 0 5px}
.seq div{flex:1;text-align:center;position:relative;padding-top:17px}
.seq div::before{content:"";position:absolute;top:5px;left:50%;width:8px;height:8px;
 border-radius:50%;background:var(--c);transform:translateX(-50%) scale(0);
 animation:dotIn .35s cubic-bezier(.2,1.4,.4,1) forwards}
.seq div::after{content:"";position:absolute;top:8.5px;left:50%;height:1.5px;
 background:rgba(229,184,122,.45);width:0;animation:lineIn .45s ease forwards}
.seq div:last-child::after{display:none}
.seq div span{font-size:11.5px;color:var(--paper2);opacity:0;animation:fIn .4s forwards}
@keyframes dotIn{to{transform:translateX(-50%) scale(1)}}
@keyframes lineIn{to{width:100%}}
@keyframes fIn{to{opacity:1}}
.seq div:nth-child(1)::before{animation-delay:0s}.seq div:nth-child(2)::before{animation-delay:.4s}
.seq div:nth-child(3)::before{animation-delay:.8s}
.seq div:nth-child(1)::after{animation-delay:.15s}.seq div:nth-child(2)::after{animation-delay:.55s}
.seq div:nth-child(1) span{animation-delay:.15s}.seq div:nth-child(2) span{animation-delay:.55s}
.seq div:nth-child(3) span{animation-delay:.95s}

.nameB{text-align:center;padding:6px 0}
.nameB .pre{font-family:var(--serif);font-size:15px;color:var(--paper2);margin-bottom:12px}
.nameB .word{font-family:var(--serif);font-size:27px;font-weight:700;color:var(--c);
 line-height:1.4;margin-bottom:12px;animation:spread 1.15s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spread{0%{transform:scale(.25);opacity:0;filter:blur(14px)}
 55%{transform:scale(1.06);opacity:1;filter:blur(3px)}
 100%{transform:scale(1);opacity:1;filter:blur(0)}}
.nameB .post{font-size:13px;color:var(--paper2);line-height:1.9}

.vt{display:flex;gap:6px;margin-top:18px}
.vt button{flex:1;background:none;border:1px solid var(--line2);color:var(--paper2);
 padding:13px;cursor:pointer;font-size:13.5px;transition:.16s}
.vt button:hover{border-color:var(--c);color:var(--c)}
.react{display:none;margin-top:15px;animation:pop .5s cubic-bezier(.2,.7,.3,1)}
.react.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ripple{position:fixed;left:50%;top:50%;width:8px;height:8px;border-radius:50%;
 border:1.5px solid var(--c);pointer-events:none;z-index:99;
 animation:rp 1s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes rp{to{width:540px;height:540px;margin:-270px 0 0 -270px;opacity:0;border-width:.5px}}
.agr{display:flex;align-items:center;gap:8px;margin-top:12px;
 font-family:var(--mono);font-size:9px;color:var(--paper3)}
.agr .bar{flex:1;height:2px;background:var(--line);max-width:110px}
.agr .bar i{display:block;height:100%;background:var(--c);width:0;animation:agrIn 1s ease .2s forwards}
@keyframes agrIn{to{width:var(--w)}}
.agr b{color:var(--c);font-weight:500}
.soc{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9px;
 color:var(--paper3);margin-top:12px}
.soc .dot{width:5px;height:5px;border-radius:50%;background:var(--teal);
 box-shadow:0 0 8px var(--teal);animation:pl 2.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.soc b{color:var(--c);font-weight:400}

/* 잠금 */
.dz{padding:14px 0;border-bottom:1px solid rgba(46,39,64,.7)}
.dz .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--c);margin-bottom:6px}
.dz p{font-family:var(--serif);font-size:16px;line-height:1.8}
.bl{display:inline-block;padding:0 3px;border-radius:2px;
 animation:lock .7s ease .5s forwards;color:var(--paper)}
@keyframes lock{to{filter:blur(4.5px);background:var(--paper3);color:transparent}}

/* 티어 */
.tier{border:1px solid var(--line);background:var(--bg2);padding:15px;margin-bottom:8px;
 cursor:pointer;position:relative;transition:.16s}
.tier:hover{border-color:var(--c)}.tier.free{border-color:var(--gold)}
.tier .tp{display:flex;justify-content:space-between;align-items:baseline}
.tier .nm{font-family:var(--serif);font-size:15.5px;font-weight:700}

<script>
/* ══════════════════════════════════════════
   1. 계산 엔진

const GAN="甲乙丙丁戊己庚辛壬癸".split(""),JI="子丑寅卯辰巳午未申酉戌亥".split("");
const GE={甲:"목",乙:"목",丙:"화",丁:"화",戊:"토",己:"토",庚:"금",辛:"금",壬:"수",癸:"수"};
const YY={甲:1,乙:0,丙:1,丁:0,戊:1,己:0,庚:1,辛:0,壬:1,癸:0};
const JE={子:"수",丑:"토",寅:"목",卯:"목",辰:"토",巳:"화",午:"화",未:"토",申:"금",酉:"금",戌:"토",亥:"수"};
const JJ={子:[["癸",1]],丑:[["己",1],["癸",.3],["辛",.2]],寅:[["甲",1],["丙",.3],["戊",.2]],
 卯:[["乙",1]],辰:[["戊",1],["乙",.3],["癸",.2]],巳:[["丙",1],["庚",.3],["戊",.2]],
 午:[["丁",1],["己",.3]],未:[["己",1],["丁",.3],["乙",.2]],申:[["庚",1],["壬",.3],["戊",.2]],
 酉:[["辛",1]],戌:[["戊",1],["辛",.3],["丁",.2]],亥:[["壬",1],["甲",.3]]};
const SA={목:"화",화:"토",토:"금",금:"수",수:"목"},GK={목:"토",화:"금",토:"수",금:"목",수:"화"};
const JEOL=[[2,4,"寅"],[3,6,"卯"],[4,5,"辰"],[5,6,"巳"],[6,6,"午"],[7,7,"未"],
 [8,8,"申"],[9,8,"酉"],[10,8,"戌"],[11,7,"亥"],[12,7,"子"],[1,6,"丑"]];
const OHO={甲:"丙",己:"丙",乙:"戊",庚:"戊",丙:"庚",辛:"庚",丁:"壬",壬:"壬",戊:"甲",癸:"甲"};
const OSEO={甲:"甲",己:"甲",乙:"丙",庚:"丙",丙:"戊",辛:"戊",丁:"庚",壬:"庚",戊:"壬",癸:"壬"};
const CHUNG={子:"午",丑:"未",寅:"申",卯:"酉",辰:"戌",巳:"亥",午:"子",未:"丑",申:"寅",酉:"卯",戌:"辰",亥:"巳"};
const jdn=(y,m,d)=>{const a=~~((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
 return d+~~((153*mm+2)/5)+365*yy+~~(yy/4)-~~(yy/100)+~~(yy/400)-32045};
function stdMer(y,m,d){const t=y*1e4+m*100+d;
 if(t<19120101)return{deg:127.5,label:"1908~1911 · 127.5°"};
 if(t<19540321)return{deg:135,label:"1912~1954 · 135°"};
 if(t<19610810)return{deg:127.5,label:"1954~1961 · 127.5°"};
 return{deg:135,label:"1961~ · 동경 135°"}}
const DST=[[1948,6,1,1948,9,12],[1949,4,3,1949,9,10],[1950,4,1,1950,9,9],[1951,5,6,1951,9,8],
 [1955,5,5,1955,9,8],[1956,5,20,1956,9,29],[1957,5,5,1957,9,21],[1958,5,4,1958,9,20],
 [1959,5,3,1959,9,19],[1960,5,1,1960,9,17],[1987,5,10,1987,10,11],[1988,5,8,1988,10,9]];
const isDST=(y,m,d)=>{const t=y*1e4+m*100+d;
 return DST.some(r=>t>=r[0]*1e4+r[1]*100+r[2]&&t<=r[3]*1e4+r[4]*100+r[5])};

function calc(y,m,d,h,mi,sex,lon=126.98,hourKnown=true){
 const std=stdMer(y,m,d),dst=isDST(y,m,d),lc=(lon-std.deg)*4;
 let mins=h*60+mi; if(dst)mins-=60; mins+=lc;
 let sh=0; if(mins<0){mins+=1440;sh=-1} if(mins>=1440){mins-=1440;sh=1}
 const th=~~(mins/60),tm=Math.round(mins%60);
 const J0=jdn(y,m,d)+sh;
 const dt=new Date(Date.UTC(y,m-1,d)); dt.setUTCDate(dt.getUTCDate()+sh);
 const Y2=dt.getUTCFullYear(),M2=dt.getUTCMonth()+1,D2=dt.getUTCDate();
 let Y=Y2; if(M2<2||(M2===2&&D2<4))Y=Y2-1;
 const yG=GAN[((Y-4)%10+10)%10],yJ=JI[((Y-4)%12+12)%12];
 let mJ="丑";
 for(let i=0;i<12;i++){const[jm,jd,jj]=JEOL[i],nx=JEOL[(i+1)%12];let ok;
  if(jm<=nx[0])ok=(M2>jm||(M2===jm&&D2>=jd))&&(M2<nx[0]||(M2===nx[0]&&D2<nx[1]));
  else ok=(M2>jm||(M2===jm&&D2>=jd))||(M2<nx[0]||(M2===nx[0]&&D2<nx[1]));
  if(ok){mJ=jj;break}}
 const off=((JI.indexOf(mJ)-JI.indexOf("寅"))%12+12)%12;
 const mG=GAN[(GAN.indexOf(OHO[yG])+off)%10];
 const B=jdn(1900,1,1);
 const dG=GAN[((J0-B)%10+GAN.indexOf("甲")+10)%10];
 const dJ=JI[(((J0-B)%12)+JI.indexOf("戌")+12)%12];
 const hi=~~(((th+1)%24)/2),hJ=JI[hi],hG=GAN[(GAN.indexOf(OSEO[dG])+hi)%10];
 const P=[[yG,yJ,"년주"],[mG,mJ,"월주"],[dG,dJ,"일주"],
  hourKnown?[hG,hJ,"시주"]:["◇","◇","시주"]];
 const CP=hourKnown?P:P.slice(0,3);        // 셈에 쓰는 기둥
 const el={목:0,화:0,토:0,금:0,수:0};
 CP.forEach(p=>{el[GE[p[0]]]+=1;JJ[p[1]].forEach(([g,w])=>el[GE[g]]+=w)});
 Object.keys(el).forEach(k=>el[k]=+el[k].toFixed(1));
 const me=GE[dG],help=[me,Object.keys(SA).find(k=>SA[k]===me)];
 const tot=Object.values(el).reduce((a,b)=>a+b,0);
 const score=(help.includes(JE[mJ])?25:0)+(help.includes(JE[dJ])?18:0)
  +Math.round((help.reduce((a,k)=>a+el[k],0)/tot-.4)*100);
 const strength=score>=20?"신강":score<=-10?"신약":"중화";
 const yong=strength==="신강"
  ?[GK[me],SA[me],Object.keys(GK).find(k=>GK[k]===me)].reduce((a,b)=>el[a]<el[b]?a:b)
  :help.reduce((a,b)=>el[a]<el[b]?a:b);
 const TG=g=>{const e=GE[g],s=YY[g]===YY[dG];
  if(e===me)return s?"비견":"겁재"; if(SA[me]===e)return s?"식신":"상관";
  if(GK[me]===e)return s?"편재":"정재"; if(GK[e]===me)return s?"편관":"정관";
  return s?"편인":"정인"};
 const tg={};CP.forEach((p,i)=>{if(i!==2)tg[TG(p[0])]=(tg[TG(p[0])]||0)+1;
  const b=JJ[p[1]][0][0];tg[TG(b)]=(tg[TG(b)]||0)+1});
 const g=n=>tg[n]||0;
 const fw=(YY[yG]===1)===(sex==="M");
 const sAge=Math.max(1,(D2%3)+3),age=2026-y,deun=[];
 for(let i=0;i<8;i++){const k=fw?i+1:-(i+1);
  deun.push({gz:GAN[((GAN.indexOf(mG)+k)%10+10)%10]+JI[((JI.indexOf(mJ)+k)%12+12)%12],age:sAge+i*10})}
 const nowI=Math.max(0,deun.findIndex(x=>x.age>age)-1);
 const strong=Object.keys(el).reduce((a,b)=>el[a]>el[b]?a:b);
 const weak=Object.keys(el).reduce((a,b)=>el[a]<el[b]?a:b);
 return {P,dG,dJ,el,strength,score,yong,tg,g,deun,nowI,age,sex,strong,weak,
  gap:+(el[strong]-el[weak]).toFixed(1),
  hourKnown, iljiChung:CP.some((p,i)=>i!==2&&p[1]===CHUNG[dJ]),
  gwan:g("정관")+g("편관"),jae:g("정재")+g("편재"),sik:g("식신")+g("상관"),
  bi:g("비견")+g("겁재"),
  topTG:Object.keys(tg).reduce((a,b)=>tg[a]>tg[b]?a:b,"비견"),
  deunTG:TG(deun[nowI].gz[0]),
  corr:{std,dst,lc:+lc.toFixed(1),before:`${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}`,
   after:`${String(th).padStart(2,"0")}:${String(tm).padStart(2,"0")}`,sh}};
}

/* ── 훅 렌더 ── */
function segInit(){
 const G=segs();
 $("segs").innerHTML=G.map((sg,i)=>{
  if(sg.end)return `<div class="blk hide" data-i="${i}">
   ${nr([`${chr().n}가 종이를 덮었다.`])}
   <p style="font-family:var(--serif);font-size:18px;line-height:1.78;color:var(--c)">
    여기까지가 <b>여덟 글자 중 셋</b>으로 본 것이다.</p>
   <p class="tx mt">나머지 다섯에는 <b>왜</b>와 <b>언제</b>가 들어 있다.</p>
   <button class="btn mt" onclick="go('d0')">값 없이 한 겹 더</button>
   <button class="btn gh" onclick="go('d1')">어디까지 볼지 고른다</button>
   <p class="sm mt" style="text-align:center">값은 아직 묻지 않았다</p></div>`;
  return `<div class="blk hide" data-i="${i}">
   ${sg.lab?`<div class="lab">${sg.lab}</div>`:""}
   ${sg.noSrc?"":`<span class="src">근거 · ${sg.src}</span>`}
   ${sg.html}
   ${sg.noSrc?"":agrHTML(sg.lab+sg.src)}
   <div class="vt" id="vt${i}"><button onclick="vote(${i},1)">그렇소</button>
    <button onclick="vote(${i},0)">아니오</button></div>
   <div class="react" id="rc${i}"></div></div>`}).join("");
 openSeg(0)}
function openSeg(i){const el=document.querySelector(`.blk[data-i="${i}"]`);if(!el)return;
 el.classList.remove("hide");requestAnimationFrame(()=>el.classList.add("in"));
 setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),140)}
function vote(i,y){ripple();const sg=segs()[i];
 $("rc"+i).innerHTML=say(y?sg.yes:sg.no,chr().n);$("rc"+i).classList.add("on");
 $("vt"+i).style.cssText="transition:.35s;overflow:hidden;max-height:0;opacity:0;margin:0";
 setTimeout(()=>openSeg(i+1),660)}

/* ── 무료 6단 렌더 ── */
function freeInit(){
 $("fsegs").innerHTML=freeSegs().map((sg,i)=>{
  if(sg.end)return `<div class="blk hide" data-f="${i}">
   ${nr([`${chr().n}가 붓을 내려놓았다.`])}
   ${say(`여기까지가 값 없이 하는 얘기요.<br>
    <b>왜</b> 그런지와 <b>언제</b> 그런지는 아직 안 했소.`,chr().n)}
   <div class="dz"><div class="k">왜</div><p>이 구조가 만들어진 자리는 <span class="bl">가가가가</span>일세.</p></div>
   <div class="dz"><div class="k">언제</div><p>${F.deun[F.nowI].gz} 대운이 끝나는 <span class="bl">가가가</span>년.</p></div>
   <div class="dz"><div class="k">어떻게</div><p>그릇을 만드는 길은 <span class="bl">가가</span>가지야.
    그대에게 맞는 건 <span class="bl">가</span>번이오.</p></div>
   <button class="btn mt" onclick="go('d1')">마저 본다</button>
   <button class="btn gh" onclick="go('c5')">카드만 받고 나선다</button>
   <button class="btn gh" onclick="go('h1')">다른 사람에게 물어본다</button>
   <p class="sm mt" style="text-align:center">값 없이 나가도 붙잡지 않소</p></div>`;
  return `<div class="blk hide" data-f="${i}"><div class="lab">${sg.lab}</div>
   <span class="src">근거 · ${sg.src}</span>${sg.html}${agrHTML("f"+sg.lab+sg.src)}
   <div class="vt" id="fvt${i}"><button onclick="fvote(${i},1)">그렇소</button>
    <button onclick="fvote(${i},0)">아니오</button></div>
   <div class="react" id="frc${i}"></div></div>`}).join("");
 fopen(0)}
function fopen(i){const el=document.querySelector(`.blk[data-f="${i}"]`);if(!el)return;
 el.classList.remove("hide");requestAnimationFrame(()=>el.classList.add("in"));
 setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),140)}
function fvote(i,y){ripple();const sg=freeSegs()[i];
 $("frc"+i).innerHTML=say(y?sg.yes:sg.no,chr().n);$("frc"+i).classList.add("on");
 $("fvt"+i).style.cssText="transition:.35s;overflow:hidden;max-height:0;opacity:0;margin:0";
 setTimeout(()=>fopen(i+1),660)}

/* ══════════════════════════════════════════
   8. 라우터
   ══════════════════════════════════════════ */
const GN={A:"들어가다",B:"둘러보다",C:"읽다",D:"값을 치르다",H:"이어지다",F:"모으다",G:"다시 오다",R:"남기다"};
const HIST=[];
function go(id,noPush){
 const s=S[id];if(!s)return;
 if(!noPush&&CUR&&CUR!==id){HIST.push(CUR);if(HIST.length>40)HIST.shift()}
 CUR=id;
 $("view").innerHTML=s.r();
 $("lab").textContent=id.toUpperCase();
 $("snd").style.display=id==="a1"?"block":"none";
 /* 진입 서사 구간(a1~a6)에서는 상단바를 숨겨 몰입 유지 */
 const showBar=!["a1"].includes(id);
 $("topbar").classList.toggle("hide",!showBar);
 $("ttl").textContent=s.t;
 $("btBack").disabled=HIST.length===0;
 const sn=$("sealN"); if(sn)sn.textContent=ST.read.length;
 $("btSkip").style.display=["a2","a3","a4","a5"].includes(id)?"block":"none";
 document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.id===id));
 window.scrollTo({top:0});
 if(s.i)s.i()}
function back(){if(!HIST.length)return;go(HIST.pop(),true)}
function pull(){
 const gv=(a,b)=>{const e=$(a);const v=e?parseInt(e.value,10):NaN;
  return Number.isFinite(v)?v:+$(b).value};
 $("iy").value=gv("y2","iy");$("im").value=gv("m2","im");$("id_").value=gv("d2","id_");
 $("isx").value=ST.sex;
 recalc(1)}
function recalc(keep){
 if(!$("iy"))return;
 const known=ST.hour!=null, h=known?ST.hour:12;
 F=calc(+$("iy").value,+$("im").value,+$("id_").value,h,+$("imi").value,
  $("isx").value,126.98,known);
 ST.sex=$("isx").value;ST.gan=F.dG;sync();
 if(!keep&&CUR)go(CUR)}
function sync(){
 document.documentElement.style.setProperty("--c",ilgan().c);
 $("fx").innerHTML=`일간 <b>${F.dG}</b> · <b>${F.strength}</b><br>
  최강 <b>${F.strong} ${F.el[F.strong]}</b> · 최약 <b>${F.weak} ${F.el[F.weak]}</b><br>
  주도 <b>${F.topTG}</b> · 용신 <b>${F.yong}</b><br>
  대운 <b>${F.deun[F.nowI].gz}</b> · <b>${F.age}</b>세<br>
  읽음 <b>${ST.read.length}</b>/20 · ${ST.paid?"<b>결제</b>":"미결제"}`;
 document.querySelectorAll("#gg button").forEach(b=>
  b.style.borderColor=b.dataset.g===F.dG?ILGAN[F.dG].c:"var(--line)")}

/* 초기화 */
F=calc(1993,5,15,10,20,"F");
let h="",lg="";
Object.entries(S).forEach(([id,s])=>{
 if(s.g!==lg){h+=`<span class="gh">${s.g} · ${GN[s.g]}</span>`;lg=s.g}
 h+=`<a href="javascript:void 0" data-id="${id}" onclick="go('${id}')"><b>${id.toUpperCase()}</b>${s.t}</a>`});
$("nav").innerHTML=h;
$("gg").innerHTML=Object.entries(ILGAN).map(([g,v])=>
 `<button data-g="${g}" style="color:${v.c}" onclick="ST.gan='${g}';F.dG='${g}';sync();go(CUR)">${g}</button>`).join("");
$("rtog").onclick=()=>$("rail").classList.toggle("open");
$("pmod").onclick=e=>{if(e.target.id==="pmod")closeP()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeP()});
sync();go("a1");
</script>
