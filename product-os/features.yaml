  title: 발송 채널 (이메일·SMS·푸시)
  group: notification
  applicability: conditional
  condition: 손님 연락처를 받기로 결정할 때
  status: none
  reason: >-
    **이 제품은 연락처를 안 받습니다** (AUTH-* 참고). 그래서 밖으로
    밀어낼 채널이 아예 없습니다. 지금 가능한 것은 **다시 왔을 때
    보여 주는 것**(in-app)뿐입니다.
  decision_required: >-
    이메일을 받아 밀어낼지, in-app 으로만 둘지는 제품 결정입니다.
    받기로 하면 AUTH-* 의 익명 설계가 흔들립니다.

