# ══════════════════════════════════════════════════════════
# 운영 · 배포 (§29 §30)
# ══════════════════════════════════════════════════════════
- id: OPS-HEALTH
  title: 헬스체크
  group: ops
  applicability: required
  status: live
  apis: ["GET /health"]

- id: OPS-ERROR-TRACKING
  title: 오류 추적
  group: ops
  applicability: required
  status: live
  apis: ["GET /v1/admin/errors"]
  admin: [adm-overview]
  security: [no_request_body, no_stacktrace, no_pii, self_hosted]
  qa: [tests/test_errors.py]
  note: >-
    길·예외 이름·횟수만 셉니다. 밖(센트리 등)에 안 보냅니다 —
    이 집의 요청 본문에는 생년월일시가 들어 있습니다.
    손님에게는 번호(traceId)를 함께 내어 주인이 같은 자리를 찾습니다.

- id: OPS-MIGRATION
  title: 마이그레이션 · 롤백
  group: ops
  applicability: required
  status: partial
  gap: SQLite 로 왕복 검증됨. Postgres 실행 검증은 아직.

- id: OPS-SECRETS
  title: 비밀 관리
  group: ops
  applicability: required
  status: live
  note: 저장소에 키가 없습니다. fly secrets / Vercel env 로만.

- id: OPS-BACKUP
  title: 백업
  group: ops
  applicability: required
  status: live
  apis: ["POST /v1/jobs/backup"]
  schedule: .github/workflows/backup.yml (매일 04:10 KST)
  security: [job_key_guarded, no_pii_in_snapshot_names]
  qa: [tests/test_backup.py]
  note: >-
    /data 볼륨 하나에 주문과 자격이 삽니다. 날아가면 값을 치른
    손님의 자격이 사라집니다. SQLite 온라인 백업 API 로 뜨고
    이레 치를 굴립니다.
