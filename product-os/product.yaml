    - {id: explore,   title: 탐색,       screens: [a2, a3]}
    - {id: input,     title: 입력,       screens: [a4, a4b, a5]}
    - {id: chart,     title: 명식,       screens: [a6, a7]}
    - {id: hook,      title: 훅 5단,     screens: [b1, b2, b3, b4]}
    - {id: free,      title: 무료 6단,   screens: [d0]}
    - {id: aha,       title: 아하,       screens: [c1, c2]}
    - {id: paywall,   title: 값 고르기,  screens: [d1, d1b]}
  customer:
    - {id: checkout,  title: 결제,       screens: [d2, d3]}
    - {id: read,      title: 읽기,       screens: [c1, c2, c3, c4, c5, c6]}
