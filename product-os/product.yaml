    - {id: account,   title: 내 서재,    screens: [f2, r1]}
  subscriber:
    - {id: subscribe, title: 카드 걸기,  screens: [d2]}
    - {id: renew,     title: 갱신,       screens: [f2]}
    - {id: cancel,    title: 그만두기,   screens: [f2]}
  admin:
    - {id: signin,    title: 로그인,     screens: [adm-login]}
    - {id: watch,     title: 현황 파악,  screens: [adm-overview]}
    - {id: tower,     title: 관제탑,     screens: [adm-tower]}
    - {id: act,       title: 조치,       screens: [adm-refund]}

# ── 핵심 플로우 (§28 Critical Flow) ───────────────────────
# 여기 적힌 것은 Release Gate 가 직접 셉니다.
critical_flows:
  - id: CF-FREE
    title: 방문 → 명식 → 훅 → 무료 해석
    why: 제품이 존재하는 이유. 이게 깨지면 나머지는 의미가 없습니다.
  - id: CF-PAY
    title: 페이월 → 결제 → 자격 부여 → 리포트 열람
    why: 수익. 자격이 안 열리면 돈만 받고 물건을 안 준 것입니다.
  - id: CF-REFUND
    title: 환불 요청 → 판정 → 환불/재발행
    why: 전자상거래법. 그리고 "셈이 틀리면 돌려준다"는 이 집의 약속.
  - id: CF-SUB
    title: 카드 등록 → 첫 달 청구 → 갱신 → 해지
    why: 자동결제는 손님이 없는 자리에서 돈이 나갑니다.
  - id: CF-RESTORE
    title: 기기 변경 → 주문번호로 자격 되찾기
    why: 계정이 없으므로 이것이 유일한 복구 경로입니다.
  - id: CF-ADMIN
    title: 주인 로그인 → 현황 → 조치 → 감사기록
    why: 운영할 수 없는 제품은 운영 가능한 제품이 아닙니다.
